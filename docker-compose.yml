# 可选：一键拉起方案里提到的生产组件（Milvus / Neo4j / PostgreSQL / Redis）。
# 本项目默认零依赖运行（SQLite + Mock + 内置向量库），此文件仅供你切换到真实组件时参考。
# 用法：docker compose up -d   然后把 .env 里的 provider/连接串改成下面的服务地址。
version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]

  # Milvus standalone 还依赖 etcd 与 minio，这里给出最小单机版示例
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports: ["9000:9000"]
  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19530:19530"]
    depends_on: [etcd, minio]

volumes:
  pg_data:
  neo4j_data:
